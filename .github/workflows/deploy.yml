name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The screenshot gallery is generated by the prf repo and published
      # there as a release asset: a gzipped tarball whose top-level entry is
      # shots/. Set the repository variable PRF_SHOTS_URL to e.g.
      #   https://github.com/<org>/<prf>/releases/latest/download/shots.tar.gz
      # While unset, deploys succeed without the gallery (/shots will 404).
      - name: Fetch screenshot gallery
        if: vars.PRF_SHOTS_URL != ''
        env:
          PRF_SHOTS_URL: ${{ vars.PRF_SHOTS_URL }}
        run: |
          curl --fail --location --retry 3 \
            "$PRF_SHOTS_URL" -o "$RUNNER_TEMP/shots.tar.gz"
          mkdir -p public/shots
          tar -xzf "$RUNNER_TEMP/shots.tar.gz" \
            -C public/shots --strip-components=1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify demo artifacts
        run: pnpm verify:demos

      - name: Build static export
        run: pnpm build

      # TODO(#lab): compose out/lab/ from the prf repo's Clerk notebook build
      # (bb demo:public-lab output, published as a release asset) before this
      # point; until then /lab deep-links 404 in production.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
