name: Deploy site (AWS)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_SITE_BUCKET: ${{ vars.AWS_SITE_BUCKET }}
      AWS_SITE_DISTRIBUTION_ID: ${{ vars.AWS_SITE_DISTRIBUTION_ID }}
      AWS_SITE_DEPLOY_ROLE_ARN: ${{ vars.AWS_SITE_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The screenshot gallery is generated by the prf repo and published
      # there as a release asset: a gzipped tarball whose top-level entry is
      # shots/. Set the repository variable PRF_SHOTS_URL to e.g.
      #   https://github.com/<org>/<prf>/releases/latest/download/shots.tar.gz
      # While unset, deploys succeed without the gallery (/shots will 404).
      - name: Fetch screenshot gallery
        if: vars.PRF_SHOTS_URL != ''
        env:
          PRF_SHOTS_URL: ${{ vars.PRF_SHOTS_URL }}
        run: |
          curl --fail --location --retry 3 \
            "$PRF_SHOTS_URL" -o "$RUNNER_TEMP/shots.tar.gz"
          mkdir -p public/shots
          tar -xzf "$RUNNER_TEMP/shots.tar.gz" \
            -C public/shots --strip-components=1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify demo artifacts
        run: pnpm verify:demos

      - name: Build static export
        run: pnpm build

      - name: Check deploy configuration
        run: |
          missing=0
          for v in AWS_SITE_BUCKET AWS_SITE_DISTRIBUTION_ID AWS_SITE_DEPLOY_ROLE_ARN AWS_REGION; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable $v is not set."
              missing=1
            fi
          done
          exit $missing

      # TEMPORARY DEBUG: remove once OIDC assumption works
      - name: Debug OIDC token claims
        run: |
          curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" > "$RUNNER_TEMP/jwt.json"
          python3 - <<'EOF'
          import json,base64
          tok=json.load(open(__import__('os').environ['RUNNER_TEMP']+'/jwt.json'))['value']
          p=tok.split('.')[1]; p+='='*(-len(p)%4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=1))
          EOF

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SITE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Content-hashed assets and timestamped run screenshots never change
      # once uploaded: cache them forever.
      - name: Sync immutable assets
        run: |
          aws s3 sync out/ "s3://$AWS_SITE_BUCKET/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*" \
            --include "_next/static/*" \
            --include "shots/runs/*"

      # Everything else (HTML, gallery pages, JSON) should pick up new
      # deploys quickly.
      - name: Sync site
        run: |
          aws s3 sync out/ "s3://$AWS_SITE_BUCKET/" \
            --delete \
            --cache-control "public,max-age=300" \
            --exclude "_next/static/*" \
            --exclude "shots/runs/*"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$AWS_SITE_DISTRIBUTION_ID" \
            --paths "/*"
