name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned PRF EVM evidence source
        uses: actions/checkout@v4
        with:
          repository: protocol-robustness/prf-evm
          ref: 10f592994975bb6f51e12b6f94bd190c06bbbd27
          path: prf-evm
          persist-credentials: false
          submodules: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify demo artifacts
        run: pnpm verify:demos

      - name: Verify shortfall flagship publication
        run: pnpm verify:flagship

      - name: Gate composed pro-rata publication evidence
        run: pnpm verify:composed-pro-rata-publication
        env:
          PRF_EVM_ROOT: prf-evm

      - name: Build static export
        run: pnpm build

      - name: Verify exported links and flagship anchors
        run: |
          pnpm verify:flagship --export
          pnpm verify:links
